# Configuration for the daily Idukki reservoir poster.
# Human-editable source of truth. Edit freely; the daily job reads this.

# Where and how the reservoir is framed (same every day).
view:
  lat: 9.7785
  lng: 76.9782
  zoom: 11.4
  size: desktop
  width: 1920
  height: 1040

# Water colour scale keyed to the KSEB alert levels (from the daily report).
# Below the Blue threshold the water reads light→blue (normal operating range);
# once the level crosses Blue / Orange / Red it takes that alert's colour. The map
# water and the scale bar under the image both use this.
water_scale:
  floor_ft: 2300     # low reference for the scale (below normal operating range)
  low: "#cfe8fb"     # light blue, at the floor
  blue: "#2f6fe0"    # Blue alert colour
  orange: "#ef8a17"  # Orange alert colour
  red: "#e23b3b"     # Red alert colour

# Styles cycled through (the hourly job picks one). An entry is either a style id
# string, or an object { id, style, hue, chroma, lighten } for an OKLCH palette
# variant of a base style (id names the output file).
rotation:
  # soft originals
  - watercolor
  - sakura
  - ukiyo-e
  - pencil
  - nordic
  - solarpunk
  - pastel
  # distinct stock styles
  - auburn
  - linocut
  - toner
  - blueprint
  - soviet-topo
  - sanborn
  - brutalist
  - ordnance
  # OKLCH palette-shift variants (the "randomise" picks)
  - { id: watercolor-lime,    style: watercolor, hue: 90,  chroma: 1.2 }
  - { id: watercolor-aqua,    style: watercolor, hue: 200, chroma: 1.1 }
  - { id: sakura-mint,        style: sakura,     hue: 140 }
  - { id: auburn-teal,        style: auburn,     hue: 120, chroma: 1.2 }
  - { id: ordnance-lavender,  style: ordnance,   hue: 210, chroma: 1.3, lighten: 0.02 }
