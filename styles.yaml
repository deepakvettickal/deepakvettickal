# Configuration for the daily Idukki reservoir poster.
# Human-editable source of truth. Edit freely; the daily job reads this.

# Where and how the reservoir is framed (same every day).
view:
  lat: 9.7785
  lng: 76.9782
  zoom: 11.4
  size: desktop
  width: 1920
  height: 1040

# Water colour ramp, interpolated by the reservoir's live storage % (0..100).
# Bright azure when full, light sky-blue when drawn down.
water_ramp:
  full: "#0a6fd0"      # at/near FRL — vivid azure
  low: "#bfe0f7"       # near empty — light sky
  dots_full: "#0857a8" # water-pattern dots when full
  dots_low: "#dceffb"  # water-pattern dots when low

# Style-of-the-day: cycles through this list (index = day-of-year % length).
# Curated for a soft, aesthetic look with the bright-blue reservoir.
rotation:
  - watercolor    # painterly green wash
  - sakura        # pink paper — distinctive, soft
  - ukiyo-e       # Japanese woodblock, gentle
  - nordic        # clean, minimal, pale
  - pastel        # soft muted tones
