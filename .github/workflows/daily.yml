name: Daily Idukki reservoir poster

on:
  schedule:
    - cron: "20 6 * * *" # 06:20 UTC ≈ 11:50 IST, after the KSEB report updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-poster
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix map-paper

      - name: Fetch water level
        run: node scripts/fetch-level.mjs
        continue-on-error: true # keep yesterday's level if the source is down

      - name: Fetch weather
        run: node scripts/fetch-weather.mjs
        continue-on-error: true # keep yesterday's weather if the source is down

      - name: Render poster + update README
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node scripts/build.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/idukki.png out/level-bar.svg level.json weather.json README.md
          git diff --cached --quiet || git commit -m "Daily update: Idukki reservoir level"
          git push
